<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Rudraksha Farm</title>
<style>
:root{--ink:#17120e;--cream:#f4eee3;--green:#173a2b;--gold:#b68a3b;--muted:#776b5d;--line:#ddd2c2;--white:#fffaf1}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(500px,92vw);margin:0 auto}.top{background:#0d0906;color:#fff;padding:18px 0}.brand{font-weight:700;letter-spacing:.12em}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;margin:34px 0;box-shadow:0 8px 30px rgba(40,25,10,.05)}h1{font-family:Georgia,serif;font-size:32px;margin:8px 0 10px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.field{margin:16px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cfc3b2;border-radius:8px;background:#fff;font-size:16px}.btn{border:0;border-radius:9px;padding:13px 17px;cursor:pointer;background:var(--green);color:#fff;width:100%;font-weight:700}.link{display:block;text-align:center;color:var(--green);margin-top:16px}.msg{margin-top:12px;font-size:13px;line-height:1.5}.hidden{display:none}
</style></head><body>
<header class="top"><div class="wrap"><div class="brand">RUDRAKSHA FARM</div></div></header>
<main class="wrap"><section class="card"><div class="muted">The Soul of Tradition · मारवाड़ का शुद्ध घी</div><h1 id="heading">Forgot password?</h1><p id="intro" class="muted">Enter the email address linked to your customer account. We’ll send you a secure reset link if an account matches.</p>
<div id="requestForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><button id="requestBtn" class="btn">Send reset link</button></div>
<div id="resetForm" class="hidden"><div class="field"><label for="password">New password</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters" required></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="Enter password again" required></div><button id="resetBtn" class="btn">Reset password</button></div>
<div id="msg" class="msg" role="status" aria-live="polite"></div><a class="link" href="/customer.html">Back to customer login</a></section></main>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),resetToken=params.get("token")||"";
function message(s,ok=false){$("msg").textContent=s;$("msg").style.color=ok?"#24633a":"#9a2e20"}
if(resetToken){$("heading").textContent="Create a new password";$("intro").textContent="Choose a strong password with at least 8 characters. This link can be used only once and expires after 30 minutes.";$("requestForm").classList.add("hidden");$("resetForm").classList.remove("hidden")}
$("requestBtn").onclick=async()=>{const email=$("email").value.trim();if(!email)return message("Enter the email address linked to your account.");$("requestBtn").disabled=true;message("Sending request...");try{const r=await fetch("/api/customer/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to request a reset link.");message(d.message||"If an account matches, a reset link will be sent.",true)}catch(e){message(e.message)}finally{$("requestBtn").disabled=false}};
$("resetBtn").onclick=async()=>{const password=$("password").value,confirm=$("confirm").value;if(password.length<8)return message("Password must be at least 8 characters.");if(password!==confirm)return message("Passwords do not match.");$("resetBtn").disabled=true;message("Updating password...");try{const r=await fetch("/api/customer/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:resetToken,password})}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to reset password.");message(d.message||"Password reset successfully.",true);$("resetForm").classList.add("hidden");$("heading").textContent="Password updated";$("intro").textContent="You can now login with your new password."}catch(e){message(e.message)}finally{$("resetBtn").disabled=false}};
</script></body></html>
