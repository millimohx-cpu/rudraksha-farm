<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rudraksha Farm — Customer Panel</title>
<style>
:root{--ink:#17120e;--cream:#f4eee3;--green:#173a2b;--gold:#b68a3b;--muted:#776b5d;--line:#ddd2c2;--white:#fffaf1}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(900px,92vw);margin:auto}.top{background:#0d0906;color:#fff;padding:18px 0}.topin{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700;letter-spacing:.12em}.hero{text-align:center;padding:42px 0 25px}.hero h1{font-family:Georgia,serif;font-size:40px;margin:8px 0}.muted{color:var(--muted);font-size:13px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 8px 30px rgba(40,25,10,.05)}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cfc3b2;border-radius:8px;background:#fff;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 17px;cursor:pointer;background:var(--green);color:#fff}.btn.alt{background:#eee3d2;color:var(--ink)}.msg{margin-top:12px;font-size:13px;color:#9a2e20}.hidden{display:none}.profile{display:flex;justify-content:space-between;gap:15px;align-items:center}.order{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:#fff}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}.paid{background:#eaf5ec;color:#24633a}.pending{background:#fff5df;color:#8a5a08}.failed,.cancelled{background:#f9e9e5;color:#8b2e22}.track{color:var(--green);font-weight:700}.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}@media(max-width:600px){.profile{align-items:flex-start;flex-direction:column}.hero h1{font-size:32px}}
</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand">RUDRAKSHA FARM · CUSTOMER</div><button id="logout" class="btn alt hidden">Logout</button></div></header>
<main class="wrap">
<section id="login" class="card">
<div class="hero" style="padding:10px 0 18px"><div class="muted">The Soul of Tradition</div><h1>Customer Login</h1><div class="muted">मारवाड़ का शुद्ध घी</div></div>
<div id="phoneStep"><div class="field"><label>Mobile number</label><input id="phone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div><button id="send" class="btn">Send OTP</button></div>
<div id="otpStep" class="hidden"><div class="field"><label>6-digit OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter OTP"></div><button id="verify" class="btn">Verify & Continue</button> <button id="resend" class="btn alt" type="button">Resend OTP</button><p id="otpHint" class="muted"></p></div>
<div id="msg" class="msg"></div></section>
<section id="panel" class="hidden">
<div class="card profile"><div><div class="muted">Logged in as</div><h2 id="customerPhone" style="margin:6px 0">—</h2><div id="customerName" class="muted"></div></div><a class="btn" href="/">Shop Now</a></div>
<div class="card"><h2>My Orders</h2><div id="orders" class="muted">Loading orders...</div></div>
</section></main>
<script>
const $=id=>document.getElementById(id),money=n=>"₹"+Number(n||0).toLocaleString("en-IN"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let token=localStorage.getItem("rf_customer_token")||"",phone="";
function msg(x){$("msg").textContent=x||""}
function showPanel(){ $("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");loadCustomer();loadOrders(); }
function showLogin(){ $("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden"); }
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){token="";localStorage.removeItem("rf_customer_token");showLogin();throw Error("Session expired. Please login again.");}if(!r.ok)throw Error(d.error||"Request failed");return d}
$("send").onclick=async()=>{phone=$("phone").value.replace(/\D/g,"");if(phone.length!==10)return msg("Enter a valid 10-digit mobile number.");$("send").disabled=true;msg("Sending OTP...");try{const d=await fetch("/api/customer/request-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone})}).then(async r=>{const x=await r.json();if(!r.ok)throw Error(x.error||"Unable to send OTP");return x});$("phoneStep").classList.add("hidden");$("otpStep").classList.remove("hidden");$("otpHint").textContent="OTP expires in 5 minutes.";msg("OTP sent successfully.");}catch(e){msg(e.message)}finally{$("send").disabled=false}};
$("resend").onclick=()=>$("send").click();
$("verify").onclick=async()=>{const otp=$("otp").value.trim();if(!/^\d{6}$/.test(otp))return msg("Enter the 6-digit OTP.");$("verify").disabled=true;msg("Verifying...");try{const r=await fetch("/api/customer/verify-otp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,otp})}),d=await r.json();if(!r.ok)throw Error(d.error||"Invalid OTP");token=d.token;localStorage.setItem("rf_customer_token",token);msg("");showPanel();}catch(e){msg(e.message)}finally{$("verify").disabled=false}};
$("logout").onclick=async()=>{try{await api("/api/customer/logout",{method:"POST"})}catch{}token="";localStorage.removeItem("rf_customer_token");showLogin()};
async function loadCustomer(){const d=await api("/api/customer/me");$("customerPhone").textContent=d.customer.phone;$("customerName").textContent=d.customer.name||"Rudraksha Farm customer";}
async function loadOrders(){const d=await api("/api/customer/orders"),orders=d.orders||[];$("orders").innerHTML=orders.length?orders.map(o=>'<div class="order"><div class="orderhead"><div><b>'+esc(o.id)+'</b><div class="muted">'+new Date(o.createdAt).toLocaleString("en-IN")+'</div></div><div><span class="badge '+esc(o.paymentStatus)+'">'+esc(o.paymentStatus)+'</span> <span class="badge '+(o.status==="cancelled"?"cancelled":"")+'">'+esc(o.status.replaceAll("_"," "))+'</span></div></div><p>'+(o.items||[]).map(x=>esc(x.pack)+" × "+x.quantity).join(" · ")+'</p><b>'+money(o.total)+'</b>'+(o.courier||o.trackingNumber?'<p class="track">🚚 '+esc(o.courier||"Courier")+(o.trackingNumber?" · AWB: "+esc(o.trackingNumber):"")+'</p>':"")+'<div class="actions"><a class="btn alt" href="/order.html?order_id='+encodeURIComponent(o.id)+'">View Order</a><a class="btn alt" target="_blank" href="https://wa.me/917296820070?text='+encodeURIComponent("Hello Rudraksha Farm, I need help with order "+o.id)+ '">WhatsApp</a></div></div>').join(""):"No orders found for this mobile number yet.";
}
if(token)showPanel();else showLogin();
</script></body></html>
