<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rudraksha Farm — Customer Panel</title>
<style>
:root{--ink:#17120e;--cream:#f4eee3;--green:#173a2b;--gold:#b68a3b;--muted:#776b5d;--line:#ddd2c2;--white:#fffaf1}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{width:min(900px,92vw);margin:auto}.top{background:#0d0906;color:#fff;padding:18px 0}.topin{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:700;letter-spacing:.12em}.hero{text-align:center;padding:42px 0 25px}.hero h1{font-family:Georgia,serif;font-size:40px;margin:8px 0}.muted{color:var(--muted);font-size:13px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0;box-shadow:0 8px 30px rgba(40,25,10,.05)}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #cfc3b2;border-radius:8px;background:#fff;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 17px;cursor:pointer;background:var(--green);color:#fff}.btn.alt{background:#eee3d2;color:var(--ink)}.msg{margin-top:12px;font-size:13px;color:#9a2e20}.hidden{display:none}.profile{display:flex;justify-content:space-between;gap:15px;align-items:center}.order{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:#fff}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase}.paid{background:#eaf5ec;color:#24633a}.pending{background:#fff5df;color:#8a5a08}.failed,.cancelled{background:#f9e9e5;color:#8b2e22}.track{color:var(--green);font-weight:700}.actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs button{flex:1}.note{background:#eee3d2;padding:10px;border-radius:8px;font-size:12px;margin-top:12px}@media(max-width:600px){.profile{align-items:flex-start;flex-direction:column}.hero h1{font-size:32px}}
</style></head>
<body><header class="top"><div class="wrap topin"><div class="brand">RUDRAKSHA FARM · CUSTOMER</div><button id="logout" class="btn alt hidden">Logout</button></div></header>
<main class="wrap">
<section id="login" class="card"><div class="hero" style="padding:10px 0 18px"><div class="muted">The Soul of Tradition</div><h1>Customer Account</h1><div class="muted">मारवाड़ का शुद्ध घी</div></div>
<div class="tabs"><button id="loginTab" class="btn" type="button">Login</button><button id="registerTab" class="btn alt" type="button">Create Account</button></div>
<div id="loginForm"><div class="field"><label>Mobile number</label><input id="lphone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div><div class="field"><label>Password</label><input id="lpass" type="password" autocomplete="current-password" placeholder="Your password"></div><button id="loginBtn" class="btn">Login</button></div>
<div id="registerForm" class="hidden"><div class="field"><label>Name</label><input id="rname" autocomplete="name" placeholder="Your name"></div><div class="field"><label>Mobile number</label><input id="rphone" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div><div class="field"><label>Email (optional)</label><input id="remail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="rpass" type="password" minlength="8" autocomplete="new-password" placeholder="Minimum 8 characters"></div><button id="registerBtn" class="btn">Create Account</button><div class="note">Keep your password safe. SMS OTP is not required.</div></div>
<div id="msg" class="msg"></div></section>
<section id="panel" class="hidden"><div class="card profile"><div><div class="muted">Logged in as</div><h2 id="customerPhone" style="margin:6px 0">—</h2><div id="customerName" class="muted"></div></div><a class="btn" href="/">Shop Now</a></div><div class="card"><h2>My Orders</h2><div id="orders" class="muted">Loading orders...</div></div></section></main>
<script>
const $=id=>document.getElementById(id),money=n=>"₹"+Number(n||0).toLocaleString("en-IN"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let token=localStorage.getItem("rf_customer_token")||"";
function msg(x){$("msg").textContent=x||""}
function showPanel(){ $("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");loadCustomer();loadOrders(); }
function showLogin(){ $("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden"); }
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:"Bearer "+token};const r=await fetch(url,opt),d=await r.json().catch(()=>({}));if(r.status===401){token="";localStorage.removeItem("rf_customer_token");showLogin();throw Error("Session expired. Please login again.");}if(!r.ok)throw Error(d.error||"Request failed");return d}
$("loginTab").onclick=()=>{$("loginForm").classList.remove("hidden");$("registerForm").classList.add("hidden");msg("")};
$("registerTab").onclick=()=>{$("loginForm").classList.add("hidden");$("registerForm").classList.remove("hidden");msg("")};
$("loginBtn").onclick=async()=>{const phone=$("lphone").value.replace(/\D/g,""),password=$("lpass").value;if(phone.length!==10||!password)return msg("Enter your 10-digit mobile number and password.");$("loginBtn").disabled=true;msg("Signing in...");try{const r=await fetch("/api/customer/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({phone,password})}),d=await r.json();if(!r.ok)throw Error(d.error||"Login failed");token=d.token;localStorage.setItem("rf_customer_token",token);msg("");showPanel()}catch(e){msg(e.message)}finally{$("loginBtn").disabled=false}};
$("registerBtn").onclick=async()=>{const name=$("rname").value.trim(),phone=$("rphone").value.replace(/\D/g,""),email=$("remail").value.trim(),password=$("rpass").value;if(phone.length!==10||password.length<8)return msg("Enter a valid mobile number and password of at least 8 characters.");$("registerBtn").disabled=true;msg("Creating account...");try{const r=await fetch("/api/customer/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,phone,email,password})}),d=await r.json();if(!r.ok)throw Error(d.error||"Unable to create account");token=d.token;localStorage.setItem("rf_customer_token",token);msg("");showPanel()}catch(e){msg(e.message)}finally{$("registerBtn").disabled=false}};
$("logout").onclick=async()=>{try{await api("/api/customer/logout",{method:"POST"})}catch{}token="";localStorage.removeItem("rf_customer_token");showLogin()};
async function loadCustomer(){const d=await api("/api/customer/me");$("customerPhone").textContent=d.customer.phone;$("customerName").textContent=d.customer.name||"Rudraksha Farm customer";}
async function loadOrders(){const d=await api("/api/customer/orders"),orders=d.orders||[];$("orders").innerHTML=orders.length?orders.map(o=>'<div class="order"><div class="orderhead"><div><b>'+esc(o.id)+'</b><div class="muted">'+new Date(o.createdAt).toLocaleString("en-IN")+'</div></div><div><span class="badge '+esc(o.paymentStatus)+'">'+esc(o.paymentStatus)+'</span> <span class="badge">'+esc(o.status.replaceAll("_"," "))+'</span></div></div><p>'+(o.items||[]).map(x=>esc(x.pack)+" × "+x.quantity).join(" · ")+'</p><b>'+money(o.total)+'</b>'+(o.courier||o.trackingNumber?'<p class="track">🚚 '+esc(o.courier||"Courier")+(o.trackingNumber?" · AWB: "+esc(o.trackingNumber):"")+'</p>':"")+'<div class="actions"><a class="btn alt" href="/order.html?order_id='+encodeURIComponent(o.id)+'">View Order</a><a class="btn alt" target="_blank" href="https://wa.me/917296820070?text='+encodeURIComponent("Hello Rudraksha Farm, I need help with order "+o.id)+'">WhatsApp</a></div></div>').join(""):"No orders found for this mobile number yet."}
if(token)showPanel();else showLogin();
</script></body></html>
